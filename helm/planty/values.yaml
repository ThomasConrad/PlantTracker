# Default values for planty
replicaCount: 1

image:
  repository: planty
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: planty.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: planty-tls
    #   hosts:
    #     - planty.example.com

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  existingClaim: ""

# Environment configuration
env:
  HOST: "0.0.0.0"
  PORT: "3000"
  DATABASE_URL: "sqlite:/app/data/planty.db"
  UPLOAD_DIR: "/app/data/uploads"
  PLANT_COACH_PROVIDER: "mock"
  RUST_LOG: "info"

# Sensitive values — reference a Secret
secret:
  # Name of an existing secret, or leave empty to create one
  existingSecret: ""
  # Values below are used only when existingSecret is empty
  values:
    SESSION_SECRET: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

strategy:
  type: Recreate

nodeSelector: {}
tolerations: []
affinity: {}
